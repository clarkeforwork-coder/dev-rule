name: 規範檢查

'on':
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rules-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 檢查規範
        run: ruby scripts/check-rules.rb
