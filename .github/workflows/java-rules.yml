name: Java 規範完整檢查
on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '17'
      build-tool:
        type: string
        required: true
      dev-rule-ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 驗證輸入
        env:
          JAVA_VERSION: ${{ inputs.java-version }}
          BUILD_TOOL: ${{ inputs.build-tool }}
          RULE_REF: ${{ inputs.dev-rule-ref }}
        run: |
          case "$JAVA_VERSION" in 8|11|17|21) ;; *) exit 2;; esac
          case "$BUILD_TOOL" in maven|gradle) ;; *) exit 2;; esac
          # SHA 或明確 tag；不允許 branch、選項或路徑。
          case "$RULE_REF" in refs/tags/*) test "${RULE_REF#refs/tags/}" != '';; *) echo "$RULE_REF" | grep -Eq '^[a-fA-F0-9]{40}$';; esac
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: clarkeforwork-coder/dev-rule
          ref: ${{ inputs.dev-rule-ref }}
          path: vendor/dev-rule
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - name: 編譯、靜態分析、架構及基準
        env:
          BUILD_TOOL: ${{ inputs.build-tool }}
          JAVA_VERSION: ${{ inputs.java-version }}
        run: sh vendor/dev-rule/tools/java/ci/github/run.sh
      - name: 規範摘要與人工審查
        if: always()
        run: |
          if test -f .java-rules/summary.md; then cat .java-rules/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          if test -f vendor/dev-rule/tools/java/coverage/coverage.md; then
            awk '/^## .*人工/{show=1} show {print}' vendor/dev-rule/tools/java/coverage/coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 保存報告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: java-rules-reports
          path: .java-rules/
          if-no-files-found: error
