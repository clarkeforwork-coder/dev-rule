- id: JV-LS-018
  rule: rules/stacks/java/common/lambda-and-stream.md#java-stream-consumption
  title: 明確消費範圍
  level: error
  tier: pre-commit
  tool: pmd
  check: custom:StreamVariableReused
  xpath: |-
    //VariableId[@LocalVariable = true()][pmd-java:typeIs('java.util.stream.BaseStream')]
      [let $n := @Name return count(ancestor::MethodDeclaration//VariableAccess[@Name = $n][@AccessType = 'READ']) > 1]
  versions:
  - 8
  - 11
  - 17
  - 21
  status: verified
  false_positive_risk: medium
  note: 型別為 Stream 的區域變數在同一方法內被讀取兩次以上（XPath 3.1 let）；Stream 變數重新指派（s = s.filter(...)）或先
    try-with-resources 再消費一次的合法寫法會誤報；欄位型 Stream 與跨方法共用不抓；SpotBugs／Error Prone 2.52
    皆無「重用已消費 Stream」檢查；；實證版本：17、8。
  source:
  - inv-claude-a
