      /ArgumentList/LambdaExpression
      [.//MethodCall[@MethodName = ('add', 'addAll', 'put', 'putAll', 'putIfAbsent', 'offer', 'push', 'append', 'remove', 'merge', 'compute', 'computeIfAbsent')]
