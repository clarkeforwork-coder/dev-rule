- id: JV-TG-009
  rule: rules/stacks/java/common/types-and-generics.md#java-business-type-casts
  title: 不得以向下轉型補回業務型別
  level: error
  tier: pre-commit
  tool: pmd
  check: custom:DowncastFromObject
  xpath: |-
    (//CastExpression[ClassType][*[2][pmd-java:typeIsExactly('java.lang.Object')]]
     | //InfixExpression[@Operator = 'instanceof'][*[1][pmd-java:typeIsExactly('java.lang.Object')]])
     [not(ancestor::MethodDeclaration[@Name = 'equals' and @Arity = 1])]
  versions:
  - 8
  - 11
  - 17
  - 21
  status: verified
  false_positive_risk: high
  note: 對靜態型別恰為 Object 的運算式做轉型或 instanceof（含 Java 16+ 型別模式，違反（Java 17）範例也抓到）；equals(Object)
    排除；只抓「從 Object 猜回」；從較寬的業務型別向下轉型（例如 (CashPayment) payment）需要型別階層資訊，本規則不抓；邊界層（JNDI、反序列化、Map<String,
    Object> 取值、框架回呼）會大量命中，須以套件層級 exclude 或 @SuppressWarnings 配合例外流程；；實證版本：17、8。
  source:
  - inv-claude-a
