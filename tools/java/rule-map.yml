  xpath: "//CatchClause[ancestor::LambdaExpression][not(Block//ThrowStatement)]"
  versions:
  - 8
  - 11
  - 17
  - 21
  status: verified
  false_positive_risk: medium
  note: Lambda 內的 catch 沒有任何 throw（吞錯或回傳替代值）；允許部分成功且保留各筆結果的流程（catch 後記錄到結果物件）會被抓，需
    suppress；內建 EmptyCatchBlock／AvoidCatchingGenericException 抓不到此範例（catch 非空、型別具體）；；實證版本：17、8。
  source:
  - inv-claude-a
