# Java 規則對照表：每筆為一個小節 × 一條工具規則；人工審查每小節一筆。
# id: JV-<文件縮寫>-<三位流水>，建立後不重編；新增採該文件最大流水號加一。
# rule: 儲存庫相對路徑#java-錨點；title: 規範小節標題。
# level: error / warn（條文要求，非工具預設或啟用門檻）。
# tier: pre-commit / ci-compile / ci-bytecode / ci-arch / ci-build / test / manual。
# tool: pmd / checkstyle / javac / errorprone / spotbugs / archunit / jdeps / jdeprscan / maven-enforcer / gradle / none。
# check: 正式規則 ID 或 custom:<PascalCase>；同模組不同設定以 [屬性=值] 區分；none 表示人工。
# xpath: 僅 PMD 自訂規則；逐字保留來源 custom_xpath 的字串值。
# versions: 適用 Java 版本，不代表逐版實證；實證版本另載於 note。
# status: verified 正反例成功；partial 局部成功或已知漏報；candidate 未實證或失敗；manual 人工／待實作測試。
# false_positive_risk: low / medium / high；note: 審查、例外、設定與證據限制。
# source: 來源盤點 ID 的陣列；合併時保留全部來源。
# 縮寫表：
# TG: types-and-generics
# LS: lambda-and-stream
# NP: naming-packages-docs
# CC: classes-and-construction
# NO: null-and-optional
# VO: value-objects
# SR: states-and-results
# BM: boundary-mapping
# CO: collections-and-ownership
# ER: exceptions-and-resources
# EH: equality-hashing-ordering
# ND: numbers-dates-text
# CA: concurrency-and-async
# RS: reflection-and-suppression
# VP: version-policy
---
- id: JV-TG-001
  rule: rules/stacks/java/common/types-and-generics.md#java-explicit-types
  title: 明確宣告型別
  level: error
  tier: pre-commit
  tool: checkstyle
  check: RegexpSinglelineJava
  versions:
  - 11
  - 17
  - 21
  status: verified
  false_positive_risk: low
  note: 純文字規則，format="(^|[\s(,])var\s+[A-Za-z_$][\w$]*\s*(=|:|\)|,)"，ignoreComments=true；同時抓區域變數
    var 與 Lambda 的 (var x)；字串常值內出現同樣文字會誤報（罕見）；PMD 版較準確；若 pre-commit 只跑一個工具，二選一即可；；實證版本：17、11、8；設定：(id=NoVar)。
  source:
  - inv-claude-a
