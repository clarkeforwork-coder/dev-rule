- id: JV-TG-007
  rule: rules/stacks/java/common/types-and-generics.md#java-input-output-type-relation
  title: 輸入與輸出的型別關聯
  level: error
  tier: pre-commit
  tool: pmd
  check: custom:GenericMethodReturnsObject
  xpath: "//MethodDeclaration[TypeParameters]/ClassType[pmd-java:typeIsExactly('java.lang.Object')]"
  versions:
  - 8
  - 11
  - 17
  - 21
  status: verified
  false_positive_risk: medium
  note: 啟發式：宣告型別參數的方法卻回傳 Object；只涵蓋本小節範例的形狀；回傳 Map<String, Object> 或接受 List<?> 再轉型等其他失去關聯的寫法抓不到；反射／序列化工具方法可能合理回傳
    Object，需 @SuppressWarnings("PMD.GenericMethodReturnsObject")；；實證版本：17。
  source:
